// ===== ARTE: PACOTE 1 - PERSONAGENS (desenho procedural, sem imagens) =====
// Uso: ART.jogador(ctx, 'lamina', estado)  |  ART.mascote(ctx, estado)
// Convenção: dentro de cada desenho, +x = frente do personagem (direção da mira).
const ART = (() => {
  const PAL = {
    contorno: '#16131f', pele: '#f2c8a0', ouro: '#ffd34d', aco: '#dfe6ee', aco2: '#9aa6b8',
    madeira: '#8a5a32', jogador: ['#3aa0ff', '#ff9a2e'],      // P1 azul, P2 laranja
    elem: ['#ff6a2e', '#7fd8ff', '#7be04a']                   // fogo, gelo, veneno
  };
  let H = false;                                  // true = flash branco de dano
  const cor = c => (H ? '#fff' : c);

  // ---------- helpers de forma (sempre com contorno escuro) ----------
  function forma(c, fill, w = 2.5) {
    c.fillStyle = cor(fill); c.fill();
    c.lineWidth = w; c.strokeStyle = PAL.contorno; c.lineJoin = 'round'; c.stroke();
  }
  const elipse = (c, x, y, rx, ry, fill, w) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); forma(c, fill, w); };
  const poli = (c, pts, fill, w) => {

  };
  const traco = (c, fill, w) => {                  // linha com contorno (cabos, cordas, caudas)

    c.strokeStyle = PAL.contorno; c.lineWidth = w + 3; c.stroke();

  const brilho = (c, cl, b) => { c.shadowColor = cl; c.shadowBlur = b; };

  // pés alternados + tronco com ombros largos
  function base(c, s, r, corpo, pe) {
    const w = Math.sin(s.t * 13) * 5 * s.mov;

  const cabeca = (c, cl, r = 8.5, rosto = PAL.pele) => { elipse(c, 1, 0, r, r, cl); elipse(c, 5, 0, r * 0.5, r * 0.62, rosto, 1.8); };

  // ---------- as 7 classes ----------
  const CLS = {
    lamina: { r: 13, draw(c, s) {

      cabeca(c, PAL.aco2, 9);                                    // elmo
      if (s.atk) {                                                                // rastro do golpe
        c.beginPath(); c.arc(0, 0, 44, -1.3, -1.3 + 2.6 * s.atk);
        c.strokeStyle = `rgba(255,255,255,${0.8 - 0.5 * s.atk})`; c.lineWidth = 6; c.stroke();
      }
      c.save(); c.translate(9, 10); c.rotate(s.atk ? -1.3 + 2.6 * s.atk : -0.35); brilhoN5(c, s);
      poli(c, [[0, -2.5], [34, -2], [41, 0], [34, 2], [0, 2.5]], PAL.aco, 2);
      poli(c, [[3, -6.5], [7, -6.5], [7, 6.5], [3, 6.5]], PAL.ouro, 2);
      c.restore(); elipse(c, 9, 10, 3.5, 3.5, PAL.pele, 2);
    } },

    curandeiro: { r: 12, draw(c, s) {
      base(c, s, 12, '#eef6e4', '#8bbf8b');
      c.fillStyle = cor('#3fae62'); c.fillRect(-9, -1.5, 6, 3); c.fillRect(-7.5, -3, 3, 6);   // cruz nas costas
      cabeca(c, '#3fae62');
      c.beginPath(); c.moveTo(-6, 10); c.lineTo(30, 10); traco(c, PAL.madeira, 3.5);          // cajado
      const orb = 5 + Math.sin(s.t * 5) + (s.atk ? 4 * (1 - s.atk) : 0);
      c.save(); brilho(c, '#7dffa0', 14); elipse(c, 31, 10, orb, orb, '#bff8c8'); c.restore();
      elipse(c, 8, 10, 3.5, 3.5, PAL.pele, 2);

    atirador: { r: 11, draw(c, s) {

      poli(c, [[-3, -7], [3, -7], [3, 7], [-3, 7]], '#7a4b2a', 2);
      elipse(c, 0, -8, 1.8, 1.8, '#e04b4b', 1.5); elipse(c, 0, -10.5, 1.8, 1.8, '#f2e6b0', 1.5);
      c.restore();
      cabeca(c, '#2c5a4c');
      const p = s.atk ? Math.sin(s.atk * Math.PI) * 7 : 0;                                    // puxa a corda ao atirar
      c.beginPath(); c.arc(12, 0, 17, -1.15, 1.15); traco(c, PAL.madeira, 3.5);               // arco
      c.beginPath(); c.moveTo(19, -15.4); c.lineTo(19 - p, 0); c.lineTo(19, 15.4);
      c.strokeStyle = cor('#f4f0e0'); c.lineWidth = 1.5; c.stroke();                          // corda
      c.beginPath(); c.moveTo(19 - p, 0); c.lineTo(31, 0); traco(c, PAL.madeira, 1.8);        // flecha
      poli(c, [[31, -3], [37, 0], [31, 3]], PAL.aco, 1.5);
      elipse(c, 19 - p, 0, 3, 3, PAL.pele, 1.8);
    } },

    alquimista: { r: 12, draw(c, s) {
      const el = PAL.elem[s.elem || 0];

      elipse(c, -11, 0, 4, 4, el, 1.5);

      elipse(c, 6, -3.5, 3.2, 3.2, '#ffd34d', 1.8); elipse(c, 6, 3.5, 3.2, 3.2, '#ffd34d', 1.8);  // óculos
      elipse(c, 6.5, -3.5, 1.4, 1.4, '#7fd8ff', 0.5); elipse(c, 6.5, 3.5, 1.4, 1.4, '#7fd8ff', 0.5);
      const fx = 17 + (s.atk ? 7 * s.atk : 0);
      c.save(); brilho(c, el, 10);
      poli(c, [[fx - 7, 9 - 1.6], [fx - 3, 9 - 1.6], [fx - 3, 9 + 1.6], [fx - 7, 9 + 1.6]], PAL.aco2, 1.5);
      elipse(c, fx, 9, 5.5, 5.5, el); c.restore();
      elipse(c, fx - 6, 9, 3, 3, PAL.pele, 1.8);
    } },

    escudeiro: { r: 16, draw(c, s) {
      base(c, s, 16, '#8c97a8', '#4a5362');
      elipse(c, -1, -15, 7, 5, '#c9a43a'); elipse(c, -1, 15, 7, 5, '#c9a43a');                // ombreiras douradas
      cabeca(c, PAL.aco2, 9);
      poli(c, [[-6, -3], [-15, 0], [-6, 3]], '#d9453b', 2);                                   // pluma
      const l = (s.atk ? 8 * Math.sin(s.atk * Math.PI) : 0) + 6 * (s.esq || 0);               // investida
      c.save(); brilhoN5(c, s);
      elipse(c, 19 + l, 0, 9, 20, PAL.ouro); elipse(c, 19 + l, 0, 6, 16, '#3a6ea5', 1.5);     // escudo
      elipse(c, 19 + l, 0, 3, 3, PAL.ouro, 1.5); c.restore();
    } },

    cacador: { r: 11, draw(c, s) {
      base(c, s, 11, '#5b4636', '#2b2230');
      c.beginPath(); c.moveTo(-8, -3);                                                        // cachecol ao vento
      for (let i = 1; i <= 4; i++) c.lineTo(-8 - i * 6, -3 + Math.sin(s.t * 9 - i) * 3 * (0.4 + s.mov));
      traco(c, '#d9453b', 4);
      cabeca(c, '#2b2230', 8.5, '#3a2e3d');
      c.fillStyle = cor('#fff'); c.fillRect(7, -3.5, 2, 2); c.fillRect(7, 1.5, 2, 2);         // olhos
      const a = s.atk || 0;
      for (const lado of [-1, 1]) {                                                           // adagas gêmeas
        const ativo = lado < 0 ? a > 0 && a < 0.5 : a >= 0.5;
        const x = 9 + (ativo ? 10 * Math.sin((lado < 0 ? a * 2 : a * 2 - 1) * Math.PI) : 0);
        c.save(); c.translate(x, lado * 9); brilhoN5(c, s);
        poli(c, [[0, -1.8], [15, 0], [0, 1.8]], PAL.aco, 1.5); c.restore();
        elipse(c, x, lado * 9, 3, 3, PAL.pele, 1.8);
      }
    } },

    domador: { r: 12, draw(c, s) {
      base(c, s, 12, '#2f9e9a', '#5a3a1e');
      elipse(c, 0, 0, 8, 11, '#c99b5d');                                                      // colar de pelos
      cabeca(c, '#6b3f1d');
      poli(c, [[-4, -8], [-12, -15], [-8, -6]], '#e04b4b', 1.8);                              // pena
      c.beginPath();                                                                          // chicote
      if (s.atk) { c.moveTo(9, 10); c.quadraticCurveTo(25, 10 - 10 * Math.sin(s.atk * Math.PI), 20 + 26 * s.atk, 10); }
      else c.arc(15, 10, 4, 0, Math.PI * 1.7);
      traco(c, PAL.madeira, 2.2);
      elipse(c, 9, 10, 3.5, 3.5, PAL.pele, 2);
    } }
  };

  // ---------- API pública ----------
  // estado: { x, y, ang, t, mov(0-1), atk(0 ou 0-1), esq(0 ou 0-1), caido, hit, lado(0=P1,1=P2), nivel(1-5), elem(0-2) }
  function jogador(c, id, s) {
    const d = CLS[id]; if (!d) return;
    s = Object.assign({ ang: 0, t: 0, mov: 0, atk: 0, esq: 0, nivel: 1, lado: 0 }, s);
    H = !!s.hit;
    const pc = PAL.jogador[s.lado || 0], r = d.r;
    c.save(); c.translate(s.x, s.y);
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, 3, r + 3, r - 1, 0, 0, 7); c.fill();   // sombra
    if (s.nivel >= 5 && !s.caido) {                                                                     // aura nível 5
      const g = c.createRadialGradient(0, 0, r * 0.6, 0, 0, r + 18);
      g.addColorStop(0, 'rgba(255,211,77,0)'); g.addColorStop(1, `rgba(255,211,77,${0.35 + 0.15 * Math.sin(s.t * 4)})`);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r + 18, 0, 7); c.fill();
    }
    const ga0 = c.globalAlpha; c.globalAlpha = ga0 * (s.caido ? 0.55 : 1);                                                                 // anel do jogador
    c.beginPath(); c.ellipse(0, 2, r + 6, r + 3, 0, 0, 7);
    c.lineWidth = 5.5; c.strokeStyle = PAL.contorno; c.stroke(); c.lineWidth = 3; c.strokeStyle = pc; c.stroke();
    c.globalAlpha = ga0;
    c.beginPath(); c.arc(0, -r - 15, 6.5, 0, 7); forma(c, pc, 2);                                       // selo 1 / 2
    c.fillStyle = '#fff'; c.font = 'bold 9px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String((s.lado || 0) + 1), 0, -r - 14.5);
    if (s.caido) {                                                                                      // corpo caído
      elipse(c, 0, 0, r + 2, r - 3, '#7d7a86');
      c.strokeStyle = '#d9453b'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-5, -5); c.lineTo(5, 5); c.moveTo(5, -5); c.lineTo(-5, 5); c.stroke();
      c.restore(); return;
    }
    c.rotate(s.ang);
    if (s.esq) for (const k of [20, 10]) {                                                              // rastro da esquiva
      c.save(); c.globalAlpha = 0.14; c.translate(-k, 0); d.draw(c, s); c.restore();
    }
    d.draw(c, s);
    c.restore(); H = false;
  }

  // mascote do Domador: { x, y, ang, t, mov, atk, escala(1 ou 3 na Fera Alfa), furia, hit }
  function mascote(c, s) {
    s = Object.assign({ ang: 0, t: 0, mov: 0, atk: 0, escala: 1 }, s); H = !!s.hit;
    const fur = s.furia ? '#e0653a' : '#d1a36b', w = Math.sin(s.t * 16) * 3 * s.mov, b = s.atk ? 4 * Math.sin(s.atk * Math.PI) : 0;
    c.save(); c.translate(s.x, s.y); c.scale(s.escala, s.escala);
    c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, 3, 13, 9, 0, 0, 7); c.fill();
    c.rotate(s.ang);
    if (s.furia) brilho(c, '#ff4040', 14);
    const ab = Math.sin(s.t * 10) * 5;
    c.beginPath(); c.moveTo(-9, 0); c.quadraticCurveTo(-16, ab, -21, ab * 1.6); traco(c, fur, 3.5);    // rabo
    elipse(c, w, -7, 3.5, 2.8, fur); elipse(c, -w, 7, 3.5, 2.8, fur);                                 // patas
    elipse(c, 0, 0, 11, 7.5, fur);                                                                     // corpo
    c.fillStyle = cor('#8a5a32'); c.fillRect(-3, -6, 2.5, 4); c.fillRect(1, 2, 2.5, 4);                // listras
    poli(c, [[8 + b, -5], [5 + b, -11], [12 + b, -7]], fur, 2); poli(c, [[8 + b, 5], [5 + b, 11], [12 + b, 7]], fur, 2);
    elipse(c, 10 + b, 0, 6.5, 6, fur); elipse(c, 15 + b, 0, 3, 2.5, '#f1d9b0', 1.8);                   // cabeça e focinho
    c.fillStyle = cor(s.furia ? '#ffeb3b' : '#2b2230');
    c.fillRect(11 + b, -3.5, 2, 2); c.fillRect(11 + b, 1.5, 2, 2);                                     // olhos
    c.restore(); H = false;
  }

  return { PAL, CLASSES: Object.keys(CLS), jogador, mascote };
})();

      elipse(c, 0, 0, 10, 6, '#c0502e'); elipse(c, 8, 0, 5, 4.5, '#8a2f1c');

  function inimigo(c, id, s) {

  function aviso(c, tipo, o) {
